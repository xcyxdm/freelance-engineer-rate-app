spring:
  application:
    name: interview-report
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/interview_reports}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:app_password}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  thymeleaf:
    cache: false
  mail:
    host: ${MAIL_HOST:smtp.mail.yahoo.co.jp}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

contact:
  to: ${CONTACT_TO:xcyxdm@yahoo.co.jp}
  from: ${CONTACT_FROM:${MAIL_USERNAME:}}

management:
  endpoints:
    web:
      exposure:
        include: health
