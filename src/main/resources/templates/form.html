<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">フリーエンジニアの相場</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <div>
        <p class="eyebrow">Interview Report</p>
        <h1 th:text="${pageTitle}">フリーエンジニアの相場</h1>
    </div>
    <a class="button ghost" th:href="@{/}">一覧へ戻る</a>
</header>

<main class="container narrow">
    <form class="form-panel" th:action="${action}" th:object="${form}" method="post">
        <div class="grid-two">
            <label>
                <span>年齢</span>
                <input type="number" th:field="*{age}" placeholder="48" min="18" max="80">
                <small class="error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></small>
            </label>
            <label>
                <span>職種</span>
                <select th:field="*{role}">
                    <option value="">選択してください</option>
                    <option th:each="roleOption : ${roleOptions}" th:value="${roleOption}" th:text="${roleOption}"></option>
                </select>
                <small class="error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></small>
            </label>
        </div>

        <div class="grid-two">
            <label>
                <span>単価（万円）</span>
                <input type="number" th:field="*{unitPrice}" placeholder="75" min="5" max="999" step="5">
                <small class="error" th:if="${#fields.hasErrors('unitPrice')}" th:errors="*{unitPrice}"></small>
                <small class="error" th:if="${#fields.hasErrors('unitPriceStepValid')}" th:errors="*{unitPriceStepValid}"></small>
            </label>
            <label>
                <span>担当役割</span>
                <select th:field="*{assignedRole}">
                    <option value="">選択してください</option>
                    <option th:each="assignedRole : ${assignedRoles}" th:value="${assignedRole}" th:text="${assignedRole.label}"></option>
                </select>
                <small class="error" th:if="${#fields.hasErrors('assignedRole')}" th:errors="*{assignedRole}"></small>
            </label>
        </div>

        <div class="grid-two">
            <label>
                <span>勤務形態</span>
                <select th:field="*{workStyle}">
                    <option value="">選択してください</option>
                    <option th:each="workStyle : ${workStyles}" th:value="${workStyle}" th:text="${workStyle.label}"></option>
                </select>
                <small class="error" th:if="${#fields.hasErrors('workStyle')}" th:errors="*{workStyle}"></small>
            </label>
            <label>
                <span>契約形態</span>
                <select th:field="*{contractType}">
                    <option value="">選択してください</option>
                    <option th:each="contractType : ${contractTypes}" th:value="${contractType}" th:text="${contractType.label}"></option>
                </select>
                <small class="error" th:if="${#fields.hasErrors('contractType')}" th:errors="*{contractType}"></small>
            </label>
        </div>

        <label>
            <span>会社</span>
            <input type="text" th:field="*{company}" placeholder="○○">
            <small class="error" th:if="${#fields.hasErrors('company')}" th:errors="*{company}"></small>
        </label>

        <label>
            <span>案件概要</span>
            <textarea th:field="*{projectSummary}" rows="8" placeholder="Spring Boot経験&#10;AWS経験&#10;設計経験"></textarea>
            <small class="error" th:if="${#fields.hasErrors('projectSummary')}" th:errors="*{projectSummary}"></small>
        </label>

        <div class="form-actions">
            <a class="button ghost" th:href="@{/}">キャンセル</a>
            <button class="button primary" type="submit">保存</button>
        </div>
    </form>
</main>
</body>
</html>
