<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>お問い合わせ</title>
    <link rel="stylesheet" th:href="@{/css/app.css?v=20260903}">
</head>
<body>
<header class="topbar">
    <div>
        <p class="eyebrow">Contact</p>
        <h1>お問い合わせ</h1>
    </div>
    <div class="header-actions">
        <a class="button ghost" th:href="@{/}">TOPへ戻る</a>
    </div>
</header>

<main class="container narrow">
    <div class="notice" th:if="${message}" th:text="${message}"></div>

    <form class="form-panel" th:action="@{/contact}" th:object="${contactForm}" method="post">
        <label>
            <span>お名前</span>
            <input type="text" th:field="*{name}" placeholder="例：山田 太郎">
            <small class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
        </label>

        <label>
            <span>メールアドレス</span>
            <input type="email" th:field="*{email}" placeholder="例：example@example.com">
            <small class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
        </label>

        <label>
            <span>お問い合わせ内容</span>
            <textarea rows="8" th:field="*{message}" placeholder="ご相談内容、希望時期、技術内容などを入力してください。"></textarea>
            <small class="error" th:if="${#fields.hasErrors('message')}" th:errors="*{message}"></small>
        </label>

        <p class="form-help">送信内容を確認後、必要に応じてご連絡します。</p>

        <div class="form-actions">
            <a class="button ghost" th:href="@{/}">キャンセル</a>
            <button class="button primary" type="submit">送信</button>
        </div>
    </form>
</main>
</body>
</html>
