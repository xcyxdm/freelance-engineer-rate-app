services:
  db:
    image: postgres:16-alpine
    container_name: interview-report-db
    environment:
      POSTGRES_DB: interview_reports
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d interview_reports"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: interview-report-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/interview_reports
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app_password
    ports:
      - "80:8080"

volumes:
  postgres_data:
